[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghimoney"
version = "0.1.0"
description = "GHIMONEY Impact Engine: verifiable measurement of open-source impact"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
ghimoney = "ghimoney.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
