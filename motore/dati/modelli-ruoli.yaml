# Modelli per ruolo: unica fonte (la legge «zb agenti attiva», che scrive «model:» negli agenti installati).
# Alias verificati sulla documentazione ufficiale dei subagenti di Claude Code (2026-10-15):
# sonnet, opus, haiku, fable, inherit, oppure un identificativo completo.
# Regola: se il modello leggero sbaglia nel copyediting, si alza solo quel ruolo (qui, una riga).
parallelo_massimo: 3          # line editing, copyediting e controlli per capitolo: al massimo 3 subagenti alla volta
livelli: {forte: opus, medio: sonnet, leggero: haiku}
ruoli:
  architetto-struttura: forte
  editor-strutturale: forte
  diagnosta: leggero        # 2026-10-21: il più economico tra gli alias ammessi (haiku = Haiku 5.5 sull'API Anthropic,
                            # documentazione di Claude Code, «model-config»); vale per ogni lavoro del diagnosta
  direttore-editoriale: medio
  scrittore-voce: medio
  line-editor: medio
  correttore-italiano: medio
  correttore-bozze: medio
  capsula: leggero
  lettore-cieco: medio      # passo opzionale (editoriale/agenti/lettore-cieco.md)
  traduttore: medio
  revisore-fedelta: medio
