# Modelli per ruolo: unica fonte (la legge «zb agenti attiva», che scrive «model:» negli agenti installati).
# Alias verificati sulla documentazione ufficiale dei subagenti di Claude Code (2026-10-15):
# sonnet, opus, haiku, fable, inherit, oppure un identificativo completo.
# Regola (autore, 2026-10-27): forte (Opus) dove si scrive o si giudica; medio (Sonnet) per i correttori;
# leggero (Haiku) per le capsule. Il consumo si contiene con letture minime e risposte di 5 righe, non con modelli deboli.
parallelo_massimo: 3          # line editing, copyediting e controlli per capitolo: al massimo 3 subagenti alla volta
livelli: {forte: opus, medio: sonnet, leggero: haiku}
ruoli:
  architetto-struttura: forte
  editor-strutturale: forte
  diagnosta: forte          # 2026-10-27 (autore): Opus dove si scrive o si giudica; il diagnosta dà il voto di qualità
  direttore-editoriale: forte
  scrittore-voce: forte
  line-editor: forte
  correttore-italiano: medio
  correttore-bozze: medio
  capsula: leggero
  grafico: forte            # 2026-10-27: quarta, brief della copertina, stile dell'interno
  voce: forte               # 2026-10-27: scheda della voce dalle pagine campione dell'autore
  lettore-cieco: forte      # passo opzionale (editoriale/agenti/lettore-cieco.md)
