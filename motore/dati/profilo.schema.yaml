# Schema dei profili di genere (proposta B.6). Formato degli schemi del motore:
#   tipo: mappa | lista | testo | intero | numero | booleano | intervallo | scelta | qualsiasi
#   campi: {nome: schema}   (per mappa)      elementi: schema   (per lista)
#   valori: [..]            (per scelta)     obbligatorio: true|false (predefinito false)
#   nullo: true             (ammette null)   altri_campi: true (mappa aperta)
#   intervallo = lista di due numeri [a, b] con a <= b
tipo: mappa
campi:
  genere: {tipo: testo, obbligatorio: true}
  lunghezza_totale:
    tipo: mappa
    obbligatorio: true
    campi:
      consigliata: {tipo: intervallo, obbligatorio: true}
      formati:
        tipo: mappa
        obbligatorio: true
        campi:
          breve: {tipo: intervallo, obbligatorio: true}
          standard: {tipo: intervallo, obbligatorio: true}
          lungo: {tipo: intervallo, obbligatorio: true}
          epico: {tipo: intervallo, obbligatorio: true}
      parti_sopra: {tipo: intero, obbligatorio: true}
      parti_obbligatorie: {tipo: booleano}
  capitoli:
    tipo: mappa
    obbligatorio: true
    campi:
      minimo: {tipo: intero, obbligatorio: true}
      media: {tipo: intervallo, obbligatorio: true}
      massimo: {tipo: intero, obbligatorio: true}
      coerenza:
        tipo: mappa
        obbligatorio: true
        campi:
          min_su_media: {tipo: numero, obbligatorio: true}
          max_su_media: {tipo: numero, obbligatorio: true}
      scene_per_capitolo: {tipo: intervallo, obbligatorio: true}
      tolleranza_budget: {tipo: numero, obbligatorio: true}
      tolleranza_totale: {tipo: numero, obbligatorio: true}
  scene:
    tipo: mappa
    obbligatorio: true
    campi:
      lunghezza: {tipo: intervallo, obbligatorio: true}
      sequel: {tipo: intervallo, obbligatorio: true}
      budget_interno:
        tipo: mappa
        obbligatorio: true
        campi:
          apertura: {tipo: intervallo, obbligatorio: true}
          centro: {tipo: intervallo, obbligatorio: true}
          chiusura: {tipo: intervallo, obbligatorio: true}
  parole_per_atto: {tipo: lista, elementi: {tipo: numero}, obbligatorio: true}
  battiti:
    tipo: mappa
    obbligatorio: true
    campi:
      punto_centrale: {tipo: intervallo, obbligatorio: true}
      tutto_perduto: {tipo: intervallo, obbligatorio: true}
  chiusura_preferita: {tipo: scelta, valori: [gancio_domanda, gesto_oggetto, misto], obbligatorio: true}
  frase_media: {tipo: intervallo, obbligatorio: true}
  dialogo_percento: {tipo: intervallo, obbligatorio: true}
  similitudini_max_per_parole: {tipo: intero, obbligatorio: true}
  parole_filtro:
    tipo: mappa
    obbligatorio: true
    campi:
      modalita: {tipo: scelta, valori: [vieta, conta, avviso], obbligatorio: true}
      massimo_per_1000_parole: {tipo: intero, obbligatorio: true}
  lista_nera: {tipo: testo, obbligatorio: true}
  parole_per_pagina: {tipo: intero, obbligatorio: true}
  scene_obbligatorie: {tipo: lista, elementi: {tipo: testo}, obbligatorio: true}
