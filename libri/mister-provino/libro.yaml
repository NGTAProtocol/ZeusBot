voci:
  # tetti (M §3.5, §4.3, §4.4, §5.3, §5.4, §6)
  - {id: come_se, pattern: '(?i)\bcome se\b', modalita: conta, massimo: 2, ambito: capitolo}                       # M:115
  - {id: una_specie_di, pattern: '(?i)\buna specie di\b', modalita: conta, massimo: 10, ambito: libro}              # M:113
  - {id: era_peggio, pattern: '(?i)\bera peggio\b|\bqualcosa di peggio\b', modalita: conta, massimo: 2, ambito: libro}   # M:110
  - {id: non_era_x_era_y, pattern: '(?:\b[Nn]on (?:era|fu|è|sono|c''era|ci fu) [^.!?]{1,80}[.!?]\s+(?:Era|Fu|È|Sono|C''era|Ci fu)\b)', escludi_pattern: 'non è come quello di Michele', modalita: avviso, massimo: 5, ambito: libro}   # M:109 (forma generica; esclusa la frase del cap. 21, che non è la figura)
  - {id: come_si_verbo, pattern: '(?i)\bcome si [a-zà-ù]+', modalita: avviso, massimo: 1, ambito: capitolo}         # M:111
  - {id: non_risposi, pattern: '(?i)\bnon risposi\b|\bnon disse niente\b', modalita: avviso, massimo: 1, ambito: capitolo}   # M:112
  - {id: qualcosa_di, pattern: '(?i)\bqualcosa di [a-zà-ù]+', modalita: avviso, massimo: 1, ambito: capitolo}       # M:114 (prende anche i nomi: avviso)
  - {id: fischiare, pattern: '(?i)\bfisch[a-zà-ù]*', modalita: avviso, massimo: 6, ambito: libro, conta_per: unita, consentito_in_capitoli: ["35", "interludio VII", "39"], escludi_pattern: '(?i)\bfischio della nave\b|\bnave\b[^.!?]{0,30}\bfischio\b'}   # M:116 (il fischio letterale della nave non conta)
  - {id: disse_piano, pattern: '(?i)\bdisse piano\b', modalita: avviso, massimo: 1, ambito: capitolo}               # M:203
  - {id: beniami, pattern: 'Beniamì', modalita: conta, massimo: 3, ambito: libro}                                   # M:197
  - {id: l_ago, pattern: "(?i)\\bl'ago\\b", modalita: conta, massimo: 3, ambito: libro}                             # M:222
  - {id: bucarsi, pattern: '(?i)\bbucar[a-zà-ù]*|\b(mi|ti|si|ci) buc[a-zà-ù]*', modalita: avviso, massimo: 3, ambito: libro}   # M:222
  - {id: lama, pattern: '(?i)\blam[ae]\b', modalita: conta, massimo: 3, ambito: libro}                               # M:138 (solo la lama vera, al massimo 3)
  - {id: campo_del_cane, pattern: '(?i)\b(cane|cani|guinzaglio|collare)\b', modalita: avviso, massimo: 8, ambito: libro}   # M:154 (prende anche i cani veri: avviso)
  - {id: guaglio_napoletano, pattern: "(?i)\\bg?uagli[òo]'?", modalita: vieta, ambito: capitolo, consentito_in_capitoli: ["2", "35"]}   # M:189, M:194: solo con don Tobia e Ciro (cap. 2) e il magro tarantino (cap. 35)
  # vietati (M §4.3, §4.5, §5.1)
  - {id: uccello_in_gabbia, pattern: '(?i)uccello in gabbia', modalita: vieta}                                      # M:139
  - {id: silenzio_piombo, pattern: '(?i)silenzio si fece piombo', modalita: vieta}                                  # M:140
  - {id: reliquia, pattern: '(?i)\breliqui[ae]\b', modalita: vieta}                                                 # M:141
  - {id: faceva_piu_paura, pattern: '(?i)faceva più paura così|era questo a fare paura', modalita: vieta}           # M:142
  - {id: battito_di_ciglia, pattern: '(?i)in un battito di ciglia', modalita: vieta}                                # M:143
  - {id: statue, pattern: '(?i)\bstatu[ae]\b', modalita: avviso}                                                    # M:144 (vietate per persone immobili: avviso)
  - {id: animale_in_gabbia, pattern: '(?i)come un animale in gabbia|come un cane bastonato|come una bestia', modalita: vieta}   # M:145
  - {id: sangue_gelato, pattern: '(?i)il sangue mi si gelò|un brivido lungo la schiena|gelo nelle vene', modalita: vieta}   # M:146
  - {id: tempo_fermo, pattern: '(?i)in quel preciso istante|il mondo si fermò|il tempo si fermò', modalita: vieta}  # M:147
  - {id: occhi_di_ghiaccio, pattern: '(?i)occhi di ghiaccio|un sorriso che non arrivava agli occhi', modalita: vieta}   # M:148
  - {id: qualcosa_si_spezzo, pattern: '(?i)qualcosa si spezzò dentro di me|qualcosa dentro di me cambiò', modalita: vieta}   # M:149
  - {id: acqua_nera, pattern: '(?i)come acqua nera|sentinelle nere|cassa armonica', modalita: vieta}                # M:150
  - {id: ingranaggio, pattern: '(?i)\bingranagg[a-z]*', modalita: avviso}                                           # M:151 (vietato per il sistema criminale: avviso)
  - {id: non_sapevo_nominare, pattern: '(?i)qualcosa che non sapevo nominare', modalita: vieta}                     # M:157
  - {id: accenti_decorativi, pattern: '(?i)\b(siéditi|avvicìnati|giùramelo)\b', modalita: vieta}                     # M:167
