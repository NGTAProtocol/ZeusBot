  affermazione: 'r.32 «visualizzato alle ore 23:49» con r.36 «tratto da un tabulato»:
    tecnica (i tabulati dell''operatore registrano la visualizzazione di un messaggio?)'
  stato: verificato
  data: '2026-10-27'
  nota: 'i tabulati dell''operatore registrano chiamate, SMS e sessioni dati, non
    la lettura dei messaggi: il «visualizzato» viene dall''estrazione forense del
    telefono (fonti: cybersecurity360.it/?p=60555; Tavassi, Arch. pen. 2022, boa.unimib.it)'
  fonte: 'testo corretto: l''orario e il «visualizzato» vengono dalla copia forense
    del telefono, non dal tabulato (cybersecurity360.it/?p=60555)'
