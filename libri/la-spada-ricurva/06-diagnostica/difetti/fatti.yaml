  affermazione: 'r.28, r.36: un orologio con sensore cardiaco registra un «ultimo
    battito» al minuto. Molti modelli, a riposo, campionano a intervalli di alcuni
    minuti (ora il testo lo nomina come alternativa). Precedenti giudiziari con i
    dati di un dispositivo indossabile: Nilsson, Adelaide 2018; Dabate, Connecticut
    2015-17.'
  stato: verificato
  data: '2026-10-28'
  fonte: https://www.abc.net.au/news/2018-03-29/smart-watch-data-helps-police-find-suspect-in-murder-case-court/9602832
