- id: F023
  unita: '1'
  affermazione: 'r.32, r.36: «messaggio di testo… visualizzato alle 23:49». Per gli
    SMS, iOS (sms.db) salva l''orario di lettura (date_read). Android, di norma, salva
    solo un indicatore di lettura senza orario. Va verificato che la copia forense
    possa dare un orario di visualizzazione per un SMS (vale per F004).'
  stato: verificato
  data: '2026-10-28'
