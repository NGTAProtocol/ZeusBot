fatti_bloccati:
- L'archivio sotto l'Accademia è rimasto sigillato per oltre settecento anni; vi si accede decifrando un rebus visivo nei
  dettagli di dipinti barocchi dell'Accademia.
- 'Il Fondo Proibito: circa 500 manoscritti di magia pratica, mentalismo e teosofia; tra questi testi vedici dall''India portati
  a Venezia da due guru e tradotti clandestinamente in latino denso, cifrato ed eretico da alchimisti e dotti.'
- 'I ragazzi non denunciano la scoperta: usano un''IA offline addestrata da Pietro per tradurre e indicizzare i testi, per
  renderli open-source e donarli ai musei internazionali.'
- 'La Spada Ricurva: loggia plurisecolare nata dalla fusione tra massoneria napoletana, traffici veneziani con l''Oriente
  e correnti vediche e filosofiche; simbolo: due scimitarre incrociate e piegate.'
- L'ultimo re Borbone delle Due Sicilie era della setta, che usava i testi per il controllo politico; la caduta del regno
  fu anche una guerra occulta tra logge rivali.
- Oggi il Direttore, il Vicedirettore e i vertici dell'Accademia sono della setta.
- La setta detiene i debiti e i titoli finanziari della famiglia di Lorenzo.
- 'L''assistente viene assassinato dalla setta; dieci giorni dopo arriva la perizia medico-legale: l''ora del decesso è precedente
  al timestamp di un messaggio minatorio arrivato sul telefono della vittima. Prova che Procura e medicina legale sono colluse.'
- 'Assedio: in una notte di pioggia la setta isola i ragazzi nell''Accademia; Lorenzo passa i dati; l''IA di Pietro si comporta
  in modo anomalo e manipola i presenti.'
note_lettura:
- data: '2026-10-27'
  capitoli:
  - 1
  - 2
  - 3
  testo: 'Note dell''autore ai capitoli 1-3: la voce regge ed è sopra la pagina campione; evitare le formule regolari tra
    capitoli (apertura con aforisma più elenco di odori, Osservo-Confronto-Concludo identico, parole-firma come clausola ripetute),
    una sola similitudine forte per paragrafo, battute meno sentenziose, il tratto di Elana che conta va dosato, capitoli
    più corti dove la scheda lo consente.'
