name: APK Lettore di manoscritti

on:
  push:
    paths:
      - 'lettore-manoscritto/**'
      - 'android-lettore/**'
      - '.github/workflows/apk-lettore.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compila l'APK
        working-directory: android-lettore
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rinomina
        run: cp android-lettore/app/build/outputs/apk/release/app-release.apk Lettore-manoscritti.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Lettore-manoscritti-apk
          path: Lettore-manoscritti.apk

      - name: Pubblica il download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete lettore-apk --yes --cleanup-tag || true
          gh release create lettore-apk Lettore-manoscritti.apk \
            --target "$GITHUB_SHA" \
            --title "Lettore di manoscritti – APK Android" \
            --notes "Versione 1.0.${GITHUB_RUN_NUMBER} (commit ${GITHUB_SHA::7}). Scarica Lettore-manoscritti.apk sul telefono e aprilo per installarlo."
